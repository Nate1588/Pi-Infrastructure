services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp" 
      - "8080:80/tcp"
    environment:
      TZ: 'Australia/Perth'
      WEBPASSWORD: 'admin123'
      PIHOLE_DNS_: '8.8.8.8;1.1.1.1'
    volumes:
      - './data/etc-pihole:/etc/pihole'
      - './data/etc-dnsmasq.d:/etc/dnsmasq.d'
    restart: unless-stopped
